name: CI - Mini-GLPI (Backend & Frontend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend - JUnit & Build (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/mini-glpi

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar testes unitários (JUnit 5 + Mockito)
        run: chmod +x mvnw && ./mvnw test

  frontend-test-build:
    name: Frontend - Testes & Build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários (Vitest)
        run: npx ng test --watch=false

      - name: Validar build de produção
        run: npm run build
