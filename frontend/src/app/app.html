<a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

<header class="topbar">
  <div class="container topbar-inner">
    <a routerLink="/" class="brand">Mini-GLPI <span class="brand-sub">Suporte TI</span></a>

    <nav aria-label="Navegação principal" class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Abrir Chamado
      </a>

      @if (authService.autenticado()) {
        <a routerLink="/kanban" routerLinkActive="active">Painel Kanban</a>
        <button type="button" class="btn-link" (click)="authService.logout()">Sair</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Área Técnica</a>
      }
    </nav>
  </div>
</header>

<main id="conteudo-principal" class="container main-content">
  <router-outlet />
</main>
